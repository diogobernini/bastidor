name: Release

# Builds macOS (dmg/zip) and Windows (nsis/portable) installers and, for tag
# pushes, attaches them to a GitHub Release that electron-updater's
# `publish: { provider: 'github' }` config (package.json) reads from.
#
# Secrets (Settings > Secrets and variables > Actions), all optional — see
# docs/DISTRIBUTION.md for how to obtain each one:
#   CSC_LINK                     base64 (or URL) of the Developer ID Application .p12
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
#   APPLE_TEAM_ID                Developer Team ID
#
# Without CSC_LINK the macOS build is intentionally unsigned (CSC_IDENTITY_
# AUTO_DISCOVERY is forced off so electron-builder never tries to auto-pick
# a certificate on the runner's empty keychain). Without the APPLE_* trio,
# build/notarize.js skips notarization on its own and just logs why.

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build macOS (dmg, zip)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg zip --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # arch is pinned to x64 in package.json (build.win.target) so this is
      # deterministic regardless of the runner's own architecture.
      - name: Build Windows (nsis, portable)
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac-artifacts/*
            artifacts/win-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
